spring:
  application:
    name: bookanear-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 6
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  geocoding:
    enabled: ${GEOCODING_ENABLED:false}
    endpoint: ${GEOCODING_ENDPOINT:https://nominatim.openstreetmap.org/search}
    user-agent: ${GEOCODING_USER_AGENT:}
  media:
    enabled: ${MEDIA_ENABLED:false}
    bucket: ${MEDIA_BUCKET:booking}
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_S3_REGION:auto}
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
    max-file-bytes: 10485760
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:bookanear-api}
      expiration-minutes: 10080
    password-reset:
      minutes: ${PASSWORD_RESET_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

registration:
  home-url: ${REGISTRATION_HOME_URL:http://localhost:5173/}
  from-email: ${REGISTRATION_FROM_EMAIL:no-reply@example.test}
  token-hours: 24

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
