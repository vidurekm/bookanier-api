spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: ${SPRING_APPLICATION_NAME:bookanear-api}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:6}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:11MB}
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:UTC}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:always}
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  geocoding:
    enabled: ${GEOCODING_ENABLED:false}
    endpoint: ${GEOCODING_ENDPOINT:https://nominatim.openstreetmap.org/search}
    user-agent: ${GEOCODING_USER_AGENT:}
  media:
    enabled: ${MEDIA_ENABLED:false}
    bucket: ${MEDIA_BUCKET:booking}
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_S3_REGION:auto}
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
    max-file-bytes: ${MEDIA_MAX_FILE_BYTES:10485760}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:bookanear-api}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
    password-reset:
      minutes: ${PASSWORD_RESET_MINUTES:30}
  ai-help:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    tags-sorter: ${SWAGGER_TAGS_SORTER:alpha}
    operations-sorter: ${SWAGGER_OPERATIONS_SORTER:alpha}
  api-docs:
    path: ${OPENAPI_DOCS_PATH:/v3/api-docs}

registration:
  home-url: ${REGISTRATION_HOME_URL:http://localhost:5173/}
  from-email: ${REGISTRATION_FROM_EMAIL:no-reply@example.test}
  token-hours: ${REGISTRATION_TOKEN_HOURS:24}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:DEBUG}
    org.springframework.web.servlet.mvc.method.annotation: ${LOG_LEVEL_SPRING_MVC:DEBUG}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:DEBUG}
    org.springframework.jdbc: ${LOG_LEVEL_JDBC:DEBUG}
    org.springframework.transaction: ${LOG_LEVEL_TRANSACTION:DEBUG}
